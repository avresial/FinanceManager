<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc">
  <title id="title">Transaction automation: ordered list with expanded rule details</title>
  <desc id="desc">Three ordered rules. Rule 01 is expanded inline with IF conditions, DO actions, and a before and after transaction preview.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#eff0f2}
    .muted{fill:#b9bec6}.orange{fill:#ffa018}.green{fill:#b7e2c4}.small{font-size:14px}.tiny{font-size:12px}.regular{font-size:16px}.bold{font-weight:600}.head{font-size:32px;font-weight:500}
  </style>
  <rect width="1200" height="810" fill="#222426"/>
  <text x="40" y="43" class="orange tiny" letter-spacing="1.4">FINANCE MANAGER / AUTOMATION</text>
  <text x="40" y="83" class="head">Transaction rules</text>
  <text x="40" y="109" class="muted small">Rules run from top to bottom. Each one sees changes made by earlier rules.</text>
  <rect x="1020" y="49" width="140" height="39" rx="5" fill="#ffa018"/>
  <text x="1039" y="74" fill="#261d12" class="bold small">+ Create rule</text>
  <text x="40" y="150" class="bold regular">Rules</text>
  <rect x="96" y="134" width="29" height="22" rx="11" fill="#3b3e42"/>
  <text x="106" y="150" class="muted tiny">3</text>
  <text x="963" y="149" class="muted tiny">Change order in rule details</text>

  <!-- First ordered row -->
  <rect x="40" y="169" width="1120" height="78" rx="7" fill="#483a29" stroke="#66605a"/>
  <text x="60" y="215" class="muted regular">⋮⋮</text><text x="92" y="216" class="orange small bold">01</text>
  <text x="143" y="199" class="bold regular">Clean up ACME</text>
  <text x="143" y="223" class="muted small">Contractor contains “ACME”</text>
  <text x="530" y="213" class="muted small">Rename to <tspan fill="#eff0f2">Acme</tspan>  ·  Add <tspan fill="#eff0f2">Business</tspan></text>
  <circle cx="1068" cy="209" r="5" fill="#b7e2c4"/><text x="1082" y="214" class="green small">On</text><text x="1136" y="215" class="muted regular">⌃</text>

  <!-- Expanded detail attached directly to first row -->
  <rect x="40" y="247" width="1120" height="386" rx="6" fill="#303235" stroke="#515459"/>
  <rect x="40" y="247" width="1120" height="3" fill="#ffa018"/>
  <text x="62" y="277" class="orange tiny" letter-spacing="1">RULE 01 · ENABLED</text>
  <text x="62" y="305" font-size="23">Clean up ACME</text>
  <rect x="1035" y="266" width="105" height="34" rx="5" fill="none" stroke="#64676d"/>
  <text x="1055" y="288" class="small">Edit fields</text>

  <rect x="63" y="332" width="35" height="30" rx="4" fill="#483a29"/>
  <text x="72" y="352" class="orange tiny bold">IF</text>
  <text x="116" y="346" class="muted small">Match all conditions</text>
  <text x="116" y="369" class="regular">Contractor contains “ACME”</text>
  <text x="116" y="391" class="muted tiny">Ignore case</text>
  <line x1="80" y1="362" x2="80" y2="423" stroke="#ffa018"/>
  <rect x="63" y="423" width="35" height="30" rx="4" fill="#39463f"/>
  <text x="69" y="443" class="green tiny bold">DO</text>
  <text x="116" y="437" class="muted small">Apply actions in order</text>
  <text x="116" y="462" class="regular">01   Normalize contractor → Acme</text>
  <text x="116" y="490" class="regular">02   Add label → Business</text>
  <line x1="63" y1="519" x2="580" y2="519" stroke="#515459"/>
  <rect x="65" y="538" width="15" height="15" rx="2" fill="#ffa018"/>
  <path d="M68 545l3 3 6-7" fill="none" stroke="#222426" stroke-width="2"/>
  <text x="90" y="551" class="small">Enabled</text>
  <rect x="187" y="538" width="15" height="15" rx="2" fill="none" stroke="#aeb3bb"/>
  <text x="212" y="551" class="small">Stop after match</text>

  <!-- Before and after panel -->
  <rect x="623" y="327" width="514" height="237" rx="7" fill="#3b3e42"/>
  <text x="641" y="354" class="bold small">Transaction preview</text>
  <text x="1025" y="354" class="orange small">Test this rule →</text>
  <text x="641" y="391" class="muted tiny">BEFORE</text><text x="879" y="391" class="muted tiny">AFTER</text>
  <text x="641" y="424" class="regular bold">ACME Corp</text>
  <text x="879" y="424" class="regular bold">Acme</text>
  <text x="852" y="424" class="orange regular">→</text>
  <text x="641" y="451" class="muted tiny">Invoice September · no labels</text>
  <text x="879" y="451" class="muted tiny">Invoice September · Business</text>
  <line x1="641" y1="480" x2="1117" y2="480" stroke="#55585d"/>
  <text x="641" y="505" class="muted tiny">Example only. Actual preview uses test results.</text>
  <text x="641" y="524" class="muted tiny">No transaction is changed by previewing.</text>

  <line x1="62" y1="581" x2="1138" y2="581" stroke="#515459"/>
  <rect x="63" y="594" width="103" height="27" rx="5" fill="none" stroke="#64676d"/>
  <text x="77" y="612" class="tiny">↑ Move up</text>
  <rect x="176" y="594" width="112" height="27" rx="5" fill="none" stroke="#64676d"/>
  <text x="190" y="612" class="tiny">↓ Move down</text>
  <text x="1050" y="613" class="orange tiny">Delete rule</text>

  <!-- Remaining rules stay visible below the expanded rule -->
  <rect x="40" y="647" width="1120" height="62" rx="7" fill="#303235" stroke="#515459"/>
  <text x="60" y="686" class="muted regular">⋮⋮</text><text x="92" y="686" class="orange small bold">02</text>
  <text x="143" y="675" class="bold regular">Business expenses</text>
  <text x="143" y="696" class="muted tiny">Contractor is “Acme” · Expense</text>
  <text x="530" y="684" class="muted small">Add <tspan fill="#eff0f2">Tax review</tspan></text>
  <circle cx="1068" cy="679" r="5" fill="#b7e2c4"/><text x="1082" y="684" class="green small">On</text><text x="1136" y="685" class="muted regular">⌄</text>
  <rect x="40" y="722" width="1120" height="62" rx="7" fill="#303235" stroke="#515459"/>
  <text x="60" y="761" class="muted regular">⋮⋮</text><text x="92" y="761" class="orange small bold">03</text>
  <text x="143" y="750" class="bold regular">Internal transfer</text>
  <text x="143" y="771" class="muted tiny">Description contains “Internal”</text>
  <text x="530" y="759" class="muted small">Replace labels · Stop after match</text>
  <circle cx="1068" cy="754" r="5" fill="#999da4"/><text x="1082" y="759" class="muted small">Off</text><text x="1136" y="760" class="muted regular">⌄</text>
</svg>
