<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1200" viewBox="0 0 420 1200" font-family="Roboto, Arial, sans-serif">

  <!-- Background -->
  <rect width="420" height="1200" fill="#f5f5f5"/>

  <!-- App Bar -->
  <rect width="420" height="56" fill="#ffffff" filter="url(#shadow1)"/>
  <defs>
    <filter id="shadow1"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.15"/></filter>
    <filter id="shadow2"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.1"/></filter>
  </defs>
  <text x="56" y="34" font-size="13" fill="#555">Admin / AI Providers</text>
  <!-- Menu icon -->
  <rect x="16" y="20" width="20" height="2" rx="1" fill="#555"/>
  <rect x="16" y="27" width="20" height="2" rx="1" fill="#555"/>
  <rect x="16" y="34" width="20" height="2" rx="1" fill="#555"/>
  <!-- Logout icon -->
  <text x="392" y="36" font-size="20" fill="#555" text-anchor="middle">⎋</text>

  <!-- Page content starts at y=72 -->

  <!-- "AI Providers" heading -->
  <text x="16" y="96" font-size="20" font-weight="500" fill="#212121">AI Providers</text>

  <!-- ── Provider Card 1: OpenRouter ── -->
  <rect x="12" y="108" width="396" height="210" rx="6" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Card header -->
  <text x="20" y="133" font-size="15" font-weight="500" fill="#212121">OpenRouter</text>
  <!-- Toggle on -->
  <rect x="340" y="118" width="44" height="22" rx="11" fill="#1976d2"/>
  <circle cx="373" cy="129" r="9" fill="white"/>

  <!-- BaseUrl field -->
  <rect x="20" y="145" width="372" height="42" rx="4" fill="white" stroke="#bdbdbd" stroke-width="1"/>
  <text x="28" y="160" font-size="10" fill="#1976d2">Base URL</text>
  <text x="28" y="178" font-size="12" fill="#424242">https://openrouter.ai/api/v1</text>

  <!-- ApiKey field -->
  <rect x="20" y="196" width="372" height="42" rx="4" fill="white" stroke="#bdbdbd" stroke-width="1"/>
  <text x="28" y="211" font-size="10" fill="#1976d2">API Key (set — enter new to replace)</text>
  <text x="28" y="229" font-size="12" fill="#424242">••••••••••••••••</text>
  <text x="372" y="229" font-size="14" fill="#9e9e9e" text-anchor="end">👁</text>

  <!-- Timeout field -->
  <rect x="20" y="247" width="372" height="42" rx="4" fill="white" stroke="#bdbdbd" stroke-width="1"/>
  <text x="28" y="262" font-size="10" fill="#1976d2">Timeout (seconds)</text>
  <text x="28" y="280" font-size="12" fill="#424242">600</text>

  <!-- Save button -->
  <rect x="20" y="298" width="72" height="32" rx="4" fill="#1976d2"/>
  <text x="56" y="319" font-size="13" fill="white" text-anchor="middle" font-weight="500">SAVE</text>

  <!-- ── Provider Card 2: LmStudio ── -->
  <rect x="12" y="330" width="396" height="210" rx="6" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <text x="20" y="355" font-size="15" font-weight="500" fill="#212121">LmStudio</text>
  <!-- Toggle on -->
  <rect x="340" y="340" width="44" height="22" rx="11" fill="#1976d2"/>
  <circle cx="373" cy="351" r="9" fill="white"/>

  <rect x="20" y="367" width="372" height="42" rx="4" fill="white" stroke="#bdbdbd" stroke-width="1"/>
  <text x="28" y="382" font-size="10" fill="#1976d2">Base URL</text>
  <text x="28" y="400" font-size="12" fill="#424242">http://localhost:1234/v1</text>

  <rect x="20" y="418" width="372" height="42" rx="4" fill="white" stroke="#bdbdbd" stroke-width="1"/>
  <text x="28" y="433" font-size="10" fill="#1976d2">API Key</text>
  <text x="28" y="451" font-size="12" fill="#424242">••••••••</text>
  <text x="372" y="451" font-size="14" fill="#9e9e9e" text-anchor="end">👁</text>

  <rect x="20" y="469" width="372" height="42" rx="4" fill="white" stroke="#bdbdbd" stroke-width="1"/>
  <text x="28" y="484" font-size="10" fill="#1976d2">Timeout (seconds)</text>
  <text x="28" y="502" font-size="12" fill="#424242">600</text>

  <rect x="20" y="520" width="72" height="32" rx="4" fill="#1976d2"/>
  <text x="56" y="541" font-size="13" fill="white" text-anchor="middle" font-weight="500">SAVE</text>

  <!-- ── Provider Card 3: Ollama ── -->
  <rect x="12" y="552" width="396" height="175" rx="6" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <text x="20" y="577" font-size="15" font-weight="500" fill="#212121">Ollama</text>
  <!-- Toggle off (disabled) -->
  <rect x="340" y="562" width="44" height="22" rx="11" fill="#bdbdbd"/>
  <circle cx="351" cy="573" r="9" fill="white"/>

  <rect x="20" y="589" width="372" height="42" rx="4" fill="white" stroke="#bdbdbd" stroke-width="1"/>
  <text x="28" y="604" font-size="10" fill="#1976d2">Base URL</text>
  <text x="28" y="622" font-size="12" fill="#424242">http://localhost:11434</text>

  <rect x="20" y="640" width="372" height="42" rx="4" fill="white" stroke="#bdbdbd" stroke-width="1"/>
  <text x="28" y="655" font-size="10" fill="#1976d2">Timeout (seconds)</text>
  <text x="28" y="673" font-size="12" fill="#424242">180</text>

  <rect x="20" y="691" width="72" height="32" rx="4" fill="#1976d2"/>
  <text x="56" y="712" font-size="13" fill="white" text-anchor="middle" font-weight="500">SAVE</text>

  <!-- ── Provider Card 4: GitHub ── -->
  <rect x="12" y="738" width="396" height="140" rx="6" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <text x="20" y="763" font-size="15" font-weight="500" fill="#212121">GitHub</text>
  <!-- Toggle on -->
  <rect x="340" y="748" width="44" height="22" rx="11" fill="#1976d2"/>
  <circle cx="373" cy="759" r="9" fill="white"/>

  <rect x="20" y="775" width="372" height="42" rx="4" fill="white" stroke="#bdbdbd" stroke-width="1"/>
  <text x="28" y="790" font-size="10" fill="#1976d2">Base URL</text>
  <text x="28" y="808" font-size="12" fill="#424242">https://models.inference.ai.azure.com</text>

  <rect x="20" y="826" width="372" height="42" rx="4" fill="white" stroke="#bdbdbd" stroke-width="1"/>
  <text x="28" y="841" font-size="10" fill="#1976d2">Timeout (seconds)</text>
  <text x="28" y="859" font-size="12" fill="#424242">180</text>

  <rect x="20" y="847" width="72" height="32" rx="4" fill="#1976d2"/>
  <text x="56" y="868" font-size="13" fill="white" text-anchor="middle" font-weight="500">SAVE</text>

  <!-- ── Divider ── -->
  <line x1="12" y1="892" x2="408" y2="892" stroke="#e0e0e0" stroke-width="1"/>

  <!-- ── Fallback Strategy Section ── -->
  <text x="16" y="916" font-size="20" font-weight="500" fill="#212121">Default Fallback Strategy</text>
  <!-- Add Entry button -->
  <rect x="300" y="900" width="108" height="32" rx="4" fill="white" stroke="#1976d2" stroke-width="1"/>
  <text x="354" y="921" font-size="12" fill="#1976d2" text-anchor="middle" font-weight="500">+ ADD ENTRY</text>

  <text x="16" y="942" font-size="12" fill="#757575">Providers are tried in order. On failure the next entry is used.</text>

  <!-- Table header -->
  <rect x="12" y="952" width="396" height="36" rx="0" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>
  <text x="56" y="975" font-size="12" font-weight="500" fill="#616161">Order</text>
  <text x="130" y="975" font-size="12" font-weight="500" fill="#616161">Provider</text>
  <text x="240" y="975" font-size="12" font-weight="500" fill="#616161">Model</text>
  <text x="380" y="975" font-size="12" font-weight="500" fill="#616161">Del</text>

  <!-- Table row 1 -->
  <rect x="12" y="988" width="396" height="44" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Up/Down buttons -->
  <text x="20" y="1008" font-size="16" fill="#9e9e9e">▲</text>
  <text x="40" y="1008" font-size="16" fill="#616161">▼</text>
  <text x="130" y="1013" font-size="13" fill="#424242">LmStudio</text>
  <text x="240" y="1013" font-size="12" fill="#424242">local-model</text>
  <text x="383" y="1013" font-size="16" fill="#ef5350">🗑</text>
  <line x1="12" y1="1032" x2="408" y2="1032" stroke="#e0e0e0" stroke-width="0.5"/>

  <!-- Table row 2 -->
  <rect x="12" y="1032" width="396" height="44" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <text x="20" y="1052" font-size="16" fill="#616161">▲</text>
  <text x="40" y="1052" font-size="16" fill="#616161">▼</text>
  <text x="130" y="1057" font-size="13" fill="#424242">OpenRouter</text>
  <text x="240" y="1057" font-size="12" fill="#424242">qwen/qwen3-coder:free</text>
  <text x="383" y="1057" font-size="16" fill="#ef5350">🗑</text>
  <line x1="12" y1="1076" x2="408" y2="1076" stroke="#e0e0e0" stroke-width="0.5"/>

  <!-- Table row 3 -->
  <rect x="12" y="1076" width="396" height="44" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <text x="20" y="1096" font-size="16" fill="#616161">▲</text>
  <text x="40" y="1096" font-size="16" fill="#9e9e9e">▼</text>
  <text x="130" y="1101" font-size="13" fill="#424242">Ollama</text>
  <text x="240" y="1101" font-size="12" fill="#424242">llama3.2</text>
  <text x="383" y="1101" font-size="16" fill="#ef5350">🗑</text>

  <!-- Save Fallback button -->
  <rect x="248" y="1132" width="160" height="40" rx="4" fill="#1976d2"/>
  <text x="328" y="1157" font-size="13" fill="white" text-anchor="middle" font-weight="500">SAVE FALLBACK STRATEGY</text>

</svg>
