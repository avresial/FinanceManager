    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
        // Single Page Apps for GitHub Pages
        // MIT License
        // https://github.com/rafgraph/spa-github-pages
        // This script checks to see if a redirect is present in the query string,
        // converts it back into the correct url and adds it to the
        // browser's history using window.history.replaceState(...),
        // which won't cause the browser to attempt to load the new url.
        // When the single page app is loaded further down in this file,
        // the correct url will be waiting in the browser's history for
        // the single page app to route accordingly.
        (function (l) {
            if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function (s) {
                    return s.replace(/~and~/g, '&')
                }).join('?');
                window.history.replaceState(null, null,
                    l.pathname.slice(0, -1) + decoded + l.hash
                );
            }
        }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->

    <style>
        :root {
            --app-bg: #ffffff;
            --app-text: #111827;
            --app-text-muted: #6b7280;
            --app-spinner: #0d6efd;
            /* bootstrap primary */
            --app-ring-track: #e5e7eb;
        }

        /* Keep a non-white background even after preload ends; MudBlazor theme variables take over when available */
        html,
        body {
            background-color: var(--mud-palette-background, var(--app-bg)) !important;
            color: var(--mud-palette-text-primary, var(--app-text)) !important;
            height: 100%;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --app-bg: rgba(33, 33, 33, 1);
                /* dark slate */
                --app-text: #e6eef8;
                --app-text-muted: #94a3b8;
                --app-spinner: #66a3ff;
                --app-ring-track: #3a3f46;
            }
        }

        html.preload,
        body.preload {
            height: 100%;
            background-color: var(--app-bg) !important;
            color: var(--app-text) !important;
            /* Transition removed - preload will be removed immediately to avoid flashing */
        }

        html.preload #app,
        body.preload #app {
            min-height: 100vh;
        }

        /* --- WASM boot screen (static HTML/CSS only; replaced when Blazor starts) --- */
        .boot-screen {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            padding: 1.5rem;
            font-family: "Roboto", system-ui, sans-serif;
            color: var(--app-text);
            animation: boot-fade-in 400ms ease-out both;
        }

        .boot-brand {
            display: flex;
            align-items: center;
            gap: 0.9rem;
        }

        .boot-logo {
            width: 3rem;
            height: 3rem;
            flex: none;
            color: var(--app-spinner);
        }

        .boot-logo .boot-logo-bar {
            transform-origin: center bottom;
            transform-box: fill-box;
            animation: boot-bar-grow 1.8s ease-in-out infinite;
        }

        .boot-logo .boot-logo-bar:nth-child(2) {
            animation-delay: 0.2s;
        }

        .boot-logo .boot-logo-bar:nth-child(3) {
            animation-delay: 0.4s;
        }

        .boot-title {
            margin: 0;
            font-size: clamp(1.6rem, 5vw, 2.2rem);
            font-weight: 300;
            letter-spacing: 0.04em;
        }

        .boot-title strong {
            font-weight: 600;
        }

        /* Progress ring driven by Blazor's real boot progress.
           The runtime updates --blazor-load-percentage / --blazor-load-percentage-text while assets download. */
        .boot-progress {
            position: relative;
            width: 5.5rem;
            height: 5.5rem;
            border-radius: 50%;
            background:
                conic-gradient(var(--app-spinner) var(--blazor-load-percentage, 0%), var(--app-ring-track) 0);
            -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 0.45rem), #000 calc(100% - 0.4rem));
            mask: radial-gradient(closest-side, transparent calc(100% - 0.45rem), #000 calc(100% - 0.4rem));
        }

        .boot-progress-text {
            font-size: 0.95rem;
            font-variant-numeric: tabular-nums;
            color: var(--app-text-muted);
            letter-spacing: 0.02em;
        }

        .boot-progress-text::after {
            content: var(--blazor-load-percentage-text, "Loading…");
        }

        @keyframes boot-fade-in {
            from {
                opacity: 0;
                transform: translateY(0.5rem);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        @keyframes boot-bar-grow {

            0%,
            100% {
                transform: scaleY(0.55);
            }

            50% {
                transform: scaleY(1);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .boot-screen,
            .boot-logo .boot-logo-bar {
                animation: none;
            }
        }
    </style>

</head>

<body>

    <script>
        window.financeManager = {
            clearPreload: function () {
                try {
                    var docEl = document.documentElement;
                    if (!docEl.classList.contains('preload')) return;
                    // Remove preload immediately to avoid transition flashes
                    docEl.classList.remove('preload');
                } catch (e) { console.warn(e); }
            },
            getCookie: function (name) {
                const prefix = name + '=';
                const cookies = document.cookie ? document.cookie.split('; ') : [];
                for (const cookie of cookies) {
                    if (cookie.startsWith(prefix)) {
                        return decodeURIComponent(cookie.substring(prefix.length));
                    }
                }

                return null;
            },
            // Presence check for cookies whose meaning is "is it there", not "what does it say" — an empty value
            // still counts as present, which getCookie above cannot express since it returns the value itself.
            hasCookie: function (name) {
                const prefix = name + '=';
                const cookies = document.cookie ? document.cookie.split('; ') : [];
                return cookies.some(cookie => cookie.startsWith(prefix));
            },
            postOAuthBridge: async function (token, returnUrl) {
                let csrfToken = window.financeManager.getCookie('fm_csrf');
                if (!csrfToken) {
                    const response = await fetch('/api/Auth/csrf-token', { credentials: 'same-origin' });
                    if (!response.ok) throw new Error('Unable to initialize the OAuth security token.');
                    csrfToken = window.financeManager.getCookie('fm_csrf');
                }
                if (!csrfToken) throw new Error('The OAuth security token was not issued.');

                const form = document.createElement('form');
                form.method = 'post';
                form.action = '/api/Auth/oauth-bridge';
                form.style.display = 'none';

                const addField = function (name, value) {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = name;
                    input.value = value;
                    form.appendChild(input);
                };

                addField('token', token);
                addField('returnUrl', returnUrl);
                addField('__RequestVerificationToken', csrfToken);
                document.body.appendChild(form);
                form.submit();
            }
        };
    </script>

    <script src="js/finance-manager.js"></script>
