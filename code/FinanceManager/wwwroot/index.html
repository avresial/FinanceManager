<!DOCTYPE html>
<html lang="en" class="preload">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">

    <link rel="icon" type="image/png" href="favicon.ico" />
    <link href="FinanceManager.WebUi.styles.css" rel="stylesheet" />

    <link href="lib/roboto/roboto.css" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="_content/FinanceManager.Components/css/cardStyle.css" rel="stylesheet" />
    <link href="_content/FinanceManager.Components/css/time-series-card.css" rel="stylesheet" />
    <link href="_content/FinanceManager.Components/css/money-by-label-card.css" rel="stylesheet" />

    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
        // Single Page Apps for GitHub Pages
        // MIT License
        // https://github.com/rafgraph/spa-github-pages
        // This script checks to see if a redirect is present in the query string,
        // converts it back into the correct url and adds it to the
        // browser's history using window.history.replaceState(...),
        // which won't cause the browser to attempt to load the new url.
        // When the single page app is loaded further down in this file,
        // the correct url will be waiting in the browser's history for
        // the single page app to route accordingly.
        (function (l) {
            if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function (s) {
                    return s.replace(/~and~/g, '&')
                }).join('?');
                window.history.replaceState(null, null,
                    l.pathname.slice(0, -1) + decoded + l.hash
                );
            }
        }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->

    <style>
        :root {
            --app-bg: #ffffff;
            --app-text: #111827;
            --app-spinner: #0d6efd;
            /* bootstrap primary */
        }

        /* Keep a non-white background even after preload ends; MudBlazor theme variables take over when available */
        html,
        body {
            background-color: var(--mud-palette-background, var(--app-bg)) !important;
            color: var(--mud-palette-text-primary, var(--app-text)) !important;
            height: 100%;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --app-bg: rgba(33, 33, 33, 1);
                /* dark slate */
                --app-text: #e6eef8;
                --app-spinner: #66a3ff;
            }
        }

        html.preload,
        body.preload {
            height: 100%;
            background-color: var(--app-bg) !important;
            color: var(--app-text) !important;
            /* Transition removed - preload will be removed immediately to avoid flashing */
        }

        html.preload #app,
        body.preload #app {
            min-height: 100vh;
        }

        html.preload #app h1,
        body.preload #app h1 {
            color: var(--app-text);
        }

        html.preload .spinner-border,
        body.preload .spinner-border {
            color: var(--app-spinner);
        }
    </style>

</head>

<body>

    <script>
        window.financeManager = {
            clearPreload: function () {
                try {
                    var docEl = document.documentElement;
                    if (!docEl.classList.contains('preload')) return;
                    // Remove preload immediately to avoid transition flashes
                    docEl.classList.remove('preload');
                } catch (e) { console.warn(e); }
            },
            getCookie: function (name) {
                const prefix = name + '=';
                const cookies = document.cookie ? document.cookie.split('; ') : [];
                for (const cookie of cookies) {
                    if (cookie.startsWith(prefix)) {
                        return decodeURIComponent(cookie.substring(prefix.length));
                    }
                }

                return null;
            },
            downloadFileFromBase64: function (fileName, contentType, base64Content) {
                const byteCharacters = atob(base64Content);
                const byteNumbers = new Array(byteCharacters.length);

                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }

                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], { type: contentType });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = fileName;
                link.style.display = 'none';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            }
        };
    </script>

    <div id="app">
        <div style="position:absolute; top:30vh; width:100%; text-align:center">
            <h1>Finance manager</h1>
            <div style="display:flex; gap:10px; justify-content:center; align-items:center">
                <div class="spinner-border" role="status"></div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_content/Microsoft.AspNetCore.Components.WebAssembly.Authentication/AuthenticationService.js"></script>

    <script src="_framework/blazor.webassembly.js"></script>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>

</html>
