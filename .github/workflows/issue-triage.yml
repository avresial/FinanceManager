name: Issue triage

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: FinanceManager issue number to triage
        required: true
        type: number

permissions: {}

jobs:
  local-opencode:
    name: Triage issue with Ornith OpenCode via LiteLLM
    if: github.actor == github.repository_owner
    runs-on: [self-hosted, macOS, ARM64, codex-lmstudio]
    timeout-minutes: 45
    concurrency:
      group: codex-qwen-financemanager
      queue: max
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      PATH: /opt/homebrew/bin:/Users/a2485/.lmstudio/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      REPOSITORY: ${{ github.repository }}
    steps:
      # Do not check out the repository or pass issue content to the local
      # process. The triage skill reads the live issue through GitHub APIs.
      - name: Verify OpenCode configuration and issue-management skill
        shell: bash
        run: |
          set -euo pipefail
          command -v opencode || { echo "::error::OpenCode CLI not found on PATH."; exit 1; }
          opencode --version
          # The LiteLLM models are discovered asynchronously, so a cold
          # OpenCode service lists only built-in models at first.
          for attempt in $(seq 1 12); do
            opencode models | grep -Fxq "litellm/ornith-1.5-35b-a3b-mlx" && break
            if [ "$attempt" -eq 12 ]; then
              echo "::error::Model litellm/ornith-1.5-35b-a3b-mlx not listed by OpenCode."
              exit 1
            fi
            sleep 5
          done
          test -f /Users/a2485/.agents/skills/codebase-manage-issues/SKILL.md || { echo "::error::Missing codebase-manage-issues skill"; exit 1; }

      # All local models are served through the LiteLLM proxy, which needs
      # Docker Desktop (litellm-postgres container) to be running.
      - name: Verify the local LiteLLM proxy is reachable
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -m 10 -o /dev/null http://127.0.0.1:4000/health/liveliness \
            || { echo "::error::LiteLLM proxy on 127.0.0.1:4000 is not responding. Start Docker Desktop (litellm-postgres) and check ~/.config/litellm/litellm.stderr.log."; exit 1; }

      # OpenCode emits one compact JSON event per line. The raw stream is kept
      # in opencode-output.txt; the job log shows a readable rendering of it.
      - name: Triage the opened issue with Ornith OpenCode
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/format-events.jq" <<'JQ'
          def trim: gsub("^\\s+|\\s+$"; "");
          def clip(n): if length > n then .[:n] + "\n… (" + ((length - n) | tostring) + " more characters)" else . end;
          def indent: split("\n") | map("    " + .) | join("\n");
          def render:
            .part as $p
            | if .type == "text" then
                ($p.text | trim) as $t | if $t == "" then empty else "💬 " + $t end
              elif .type == "tool_use" then
                ($p.state.input // {}) as $in
                | ($p.state.status // "unknown") as $status
                | "▶ " + $p.tool + " (" + $status + ")\n"
                  + ((($in.command // ($in | tojson)) | tostring | clip(1500)) | indent)
                  + (if $p.state.output then "\n  ↳ output\n" + (($p.state.output | tostring | clip(1500)) | indent) else "" end)
                  + (if $p.state.error then "\n  ↳ error\n" + (($p.state.error | tostring | clip(1500)) | indent) else "" end)
              elif .type == "step_finish" then
                "· step finished (" + ($p.reason // "?") + ", tokens in/out: "
                + (($p.tokens.input // 0) | tostring) + "/" + (($p.tokens.output // 0) | tostring) + ")"
              elif .type == "error" then
                "::error::" + (.error.message // (.error | tojson))
              else empty end;
          try (fromjson | render) catch .
          JQ
          # Select the LiteLLM model explicitly so a global default cannot route
          # triage elsewhere. opencode v2 has no --dir flag, so run from the temp dir.
          opencode run \
            --format json \
            --model litellm/ornith-1.5-35b-a3b-mlx \
            --auto \
            "Read /Users/a2485/.agents/skills/codebase-manage-issues/SKILL.md and use that installed skill to triage only issue #${ISSUE_NUMBER} in ${REPOSITORY}. Do not search for or install skills. Read this issue's complete conversation, labels, timeline, and directly linked dependencies or pull requests through GitHub APIs. Read repository label definitions only when needed for classification. Do not scan unrelated issues, branches, or pull requests, inspect source code or local repository files, implement code, create branches or pull requests, or modify the local working directory. Change labels only with 'gh issue edit ${ISSUE_NUMBER} --add-label ... --remove-label ...', not raw 'gh api' label calls. Apply only supported lifecycle and type or area labels, preserve human labels and ownership, avoid duplicate comments, and report the resulting state." \
            < /dev/null 2>&1 | tee "$RUNNER_TEMP/opencode-output.txt" \
            | jq -rR --unbuffered -f "$RUNNER_TEMP/format-events.jq"
          test -s "$RUNNER_TEMP/opencode-output.txt"
