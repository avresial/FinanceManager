name: Finance Manager API CI CD

on:
  push:
    branches: [ main, develop ]
  pull_request:

env:
  AZURE_WEBAPP_NAME: 'FinanceManagerApi'
  AZURE_WEBAPP_NAME_DEV: 'FinanceManagerApi-dev'
  AZURE_WEBAPP_PACKAGE_PATH: './code/FinanceManager.Api/publish'
  DOTNET_VERSION: '10.x'
  SOLUTION_PATH: './code/FinanceManager.slnx'
  API_PROJECT_PATH: './code/FinanceManager.Api/FinanceManager.Api.csproj'
  PUBLISH_DIR: './code/FinanceManager.Api/publish'

permissions:
  checks: write
  pull-requests: write
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ./code

      - name: Build the solution
        run: dotnet build ./code --no-restore --configuration Release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-output
          path: |
            code/**/bin/Release/**
            code/**/obj/**
          retention-days: 1

  code-quality:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: build-output
          path: code

      - name: Restore dependencies
        run: dotnet restore ./code

      # Naming-rule violations (IDE1006) are a hard failure: the .editorconfig naming rules
      # are set to error severity, but the C# compiler does not run the naming analyzer during
      # `dotnet build`, so this `dotnet format` check is what actually enforces them in CI.
      - name: Enforce naming conventions
        run: dotnet format style ./code --verify-no-changes --diagnostics IDE1006 --severity error

      - name: Check code formatting
        run: dotnet format ./code --verify-no-changes --verbosity diagnostic

      - name: Build with code analysis
        run: dotnet build ./code --no-restore --configuration Release /p:EnforceCodeStyleInBuild=true

  security-scan:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: build-output
          path: code

      - name: Restore dependencies
        run: dotnet restore ./code

      # `dotnet list package --vulnerable` exits 0 even when it finds vulnerabilities, so grep the
      # output and fail the step ourselves — a known CVE must block the build, not just be reported.
      - name: Check for vulnerable packages
        run: |
          output=$(dotnet list ./code package --vulnerable --include-transitive 2>&1)
          echo "$output"
          if echo "$output" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable packages detected."
            exit 1
          fi
        continue-on-error: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp

      - name: Build for CodeQL
        run: dotnet build ./code --no-restore --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  unit-tests:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    env:
      FINANCE_MANAGER_DB_KEY: ${{ secrets.FINANCE_MANAGER_DB_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: build-output
          path: code

      - name: Restore execute permissions
        run: chmod +x -R ./code/**/bin/Release/net10.0/*

      - name: Run unit tests
        run: |
          mkdir -p ${{ github.workspace }}/TestResults
          ./code/FinanceManager.UnitTests/bin/Release/net10.0/FinanceManager.UnitTests -trx ${{ github.workspace }}/TestResults/unit-test-results.trx

      - name: Publish unit test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: 'Unit Test Results'
          path: '${{ github.workspace }}/TestResults/**/unit-test-results.trx'
          reporter: dotnet-trx

  integration-tests:
    runs-on: ubuntu-latest
    needs: [build, unit-tests]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    env:
      FINANCE_MANAGER_DB_KEY: ${{ secrets.FINANCE_MANAGER_DB_KEY }}
      UseInMemoryDatabase: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ./code

      - name: Build solution
        run: dotnet build ./code --configuration Release

      - name: Run integration tests
        run: |
          mkdir -p ${{ github.workspace }}/TestResults
          chmod +x ./code/FinanceManager.IntegrationTests/bin/Release/net10.0/FinanceManager.IntegrationTests
          ./code/FinanceManager.IntegrationTests/bin/Release/net10.0/FinanceManager.IntegrationTests -trx ${{ github.workspace }}/TestResults/integration-test-results.trx

      - name: Publish integration test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: 'Integration Test Results'
          path: '${{ github.workspace }}/TestResults/**/integration-test-results.trx'
          reporter: dotnet-trx

  architecture-tests:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ./code

      # ArchUnitNET analyzes compiled IL; Release optimizations (elided casts/locals,
      # inlined typeof) can distort the dependency graph, so the maintainers recommend
      # running architecture tests against a Debug build.
      - name: Build architecture tests (Debug)
        run: dotnet build ./code/FinanceManager.ArchitectureTests/FinanceManager.ArchitectureTests.csproj --configuration Debug

      - name: Run architecture tests
        run: |
          mkdir -p ${{ github.workspace }}/TestResults
          chmod +x ./code/FinanceManager.ArchitectureTests/bin/Debug/net10.0/FinanceManager.ArchitectureTests
          ./code/FinanceManager.ArchitectureTests/bin/Debug/net10.0/FinanceManager.ArchitectureTests -trx ${{ github.workspace }}/TestResults/architecture-test-results.trx

      - name: Publish architecture test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: 'Architecture Test Results'
          path: '${{ github.workspace }}/TestResults/**/architecture-test-results.trx'
          reporter: dotnet-trx

  publish:
    runs-on: ubuntu-latest
    needs: [build, unit-tests, integration-tests, architecture-tests, code-quality, security-scan]
    if: |
      always()
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      && needs.build.result == 'success'
      && needs.unit-tests.result == 'success'
      && needs.integration-tests.result == 'success'
      && needs.architecture-tests.result == 'success'
      && needs.code-quality.result == 'success'
      && needs.security-scan.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: build-output
          path: code

      - name: Restore dependencies
        run: dotnet restore ./code

      - name: Publish API
        run: dotnet publish ${{ env.API_PROJECT_PATH }} --configuration Release --output ${{ env.PUBLISH_DIR }} --no-build

      - name: Upload publish artifact
        uses: actions/upload-artifact@v6
        with:
          name: finance-manager-api
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
          retention-days: 30

  deploy:
    name: Deploy to Azure Web App (production)
    runs-on: ubuntu-latest
    needs: publish
    if: |
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.publish.result == 'success'
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v5
        with:
          name: finance-manager-api
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy-dev:
    name: Deploy to Azure Web App (develop)
    runs-on: ubuntu-latest
    needs: publish
    if: |
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/develop'
      && needs.publish.result == 'success'
    environment:
      name: development
      url: https://${{ env.AZURE_WEBAPP_NAME_DEV }}.azurewebsites.net

    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v5
        with:
          name: finance-manager-api
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Deploy to Azure Web App (dev)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME_DEV }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_DEV }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
