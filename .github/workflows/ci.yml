name: Finance Manager API CI CD

on:
  push:
    branches: [ main, develop ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AZURE_WEBAPP_NAME: 'FinanceManagerApi'
  AZURE_WEBAPP_NAME_DEV: 'FinanceManagerApi-dev'
  AZURE_WEBAPP_PACKAGE_PATH: './code/FinanceManager.Api/publish'
  DOTNET_VERSION: '10.x'
  SOLUTION_PATH: './code/FinanceManager.slnx'
  API_PROJECT_PATH: './code/FinanceManager.Api/FinanceManager.Api.csproj'
  PUBLISH_DIR: './code/FinanceManager.Api/publish'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('code/Directory.Packages.props', 'code/**/*.csproj', 'code/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build the solution
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release

  code-quality:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('code/Directory.Packages.props', 'code/**/*.csproj', 'code/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      # Naming-rule violations (IDE1006) are a hard failure: the .editorconfig naming rules
      # are set to error severity, but the C# compiler does not run the naming analyzer during
      # `dotnet build`, so this `dotnet format` check is what actually enforces them in CI.
      - name: Enforce naming conventions
        run: dotnet format style ./code --verify-no-changes --diagnostics IDE1006 --severity error

      - name: Check code formatting
        run: dotnet format ./code --verify-no-changes --verbosity diagnostic

      - name: Build with code analysis
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release /p:EnforceCodeStyleInBuild=true

  security-scan:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('code/Directory.Packages.props', 'code/**/*.csproj', 'code/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      # `dotnet list package --vulnerable` exits 0 even when it finds vulnerabilities, so grep the
      # output and fail the step ourselves — a known CVE must block the build, not just be reported.
      - name: Check for vulnerable packages
        run: |
          output=$(dotnet list ./code package --vulnerable --include-transitive 2>&1)
          echo "$output"
          if echo "$output" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable packages detected."
            exit 1
          fi
        continue-on-error: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp

      - name: Build for CodeQL
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  unit-tests:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    env:
      FINANCE_MANAGER_DB_KEY: ${{ secrets.FINANCE_MANAGER_DB_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('code/Directory.Packages.props', 'code/**/*.csproj', 'code/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build unit tests
        run: dotnet build ./code/FinanceManager.Tests.Unit/FinanceManager.Tests.Unit.csproj --no-restore --configuration Release

      - name: Run unit tests
        run: |
          mkdir -p ${{ github.workspace }}/TestResults
          ./code/FinanceManager.Tests.Unit/bin/Release/net10.0/FinanceManager.Tests.Unit -trx ${{ github.workspace }}/TestResults/unit-test-results.trx

      - name: Publish unit test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: 'Unit Test Results'
          path: '${{ github.workspace }}/TestResults/**/unit-test-results.trx'
          reporter: dotnet-trx

  integration-tests:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    timeout-minutes: 25
    permissions:
      contents: read
      checks: write
    env:
      FINANCE_MANAGER_DB_KEY: ${{ secrets.FINANCE_MANAGER_DB_KEY }}
      UseInMemoryDatabase: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('code/Directory.Packages.props', 'code/**/*.csproj', 'code/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build integration tests
        run: dotnet build ./code/FinanceManager.Tests.Integration/FinanceManager.Tests.Integration.csproj --no-restore --configuration Release

      - name: Run integration tests
        run: |
          mkdir -p ${{ github.workspace }}/TestResults
          ./code/FinanceManager.Tests.Integration/bin/Release/net10.0/FinanceManager.Tests.Integration -trx ${{ github.workspace }}/TestResults/integration-test-results.trx

      - name: Publish integration test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: 'Integration Test Results'
          path: '${{ github.workspace }}/TestResults/**/integration-test-results.trx'
          reporter: dotnet-trx

  architecture-tests:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('code/Directory.Packages.props', 'code/**/*.csproj', 'code/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      # ArchUnitNET analyzes compiled IL; Release optimizations (elided casts/locals,
      # inlined typeof) can distort the dependency graph, so the maintainers recommend
      # running architecture tests against a Debug build.
      - name: Build architecture tests (Debug)
        run: dotnet build ./code/FinanceManager.Tests.Architecture/FinanceManager.Tests.Architecture.csproj --configuration Debug

      - name: Run architecture tests
        run: |
          mkdir -p ${{ github.workspace }}/TestResults
          ./code/FinanceManager.Tests.Architecture/bin/Debug/net10.0/FinanceManager.Tests.Architecture -trx ${{ github.workspace }}/TestResults/architecture-test-results.trx

      - name: Publish architecture test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: 'Architecture Test Results'
          path: '${{ github.workspace }}/TestResults/**/architecture-test-results.trx'
          reporter: dotnet-trx

  # Deploy note: the target Azure Web Apps run on the free (F1) tier with a 1 GB disk quota.
  # To avoid the "restart the app to make the deploy pass" problem (the deploy needs the old and
  # new site on disk at once, and locked files block the swap), set the app setting
  #   WEBSITE_RUN_FROM_PACKAGE=1
  # on both FinanceManagerApi and FinanceManagerApi-dev so the site runs directly from the mounted
  # deployment zip instead of being extracted into wwwroot.
  #
  # RID-scoping (optional, further shrinks foreign-RID native libs): once the App Service OS is
  # confirmed, add "-r <rid> --self-contained false" (e.g. linux-x64 or win-x64) to the Publish API
  # step below. Do NOT guess the RID — publishing the wrong one yields an app that will not start.
  publish:
    runs-on: ubuntu-latest
    needs: [build, unit-tests, integration-tests, architecture-tests, code-quality, security-scan]
    if: |
      always()
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      && needs.build.result == 'success'
      && needs.unit-tests.result == 'success'
      && needs.integration-tests.result == 'success'
      && needs.architecture-tests.result == 'success'
      && needs.code-quality.result == 'success'
      && needs.security-scan.result == 'success'
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('code/Directory.Packages.props', 'code/**/*.csproj', 'code/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.API_PROJECT_PATH }}

      - name: Publish API
        run: dotnet publish ${{ env.API_PROJECT_PATH }} --no-restore --configuration Release --output ${{ env.PUBLISH_DIR }}

      - name: Upload publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: finance-manager-api
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
          retention-days: 30

  deploy:
    name: Deploy to Azure Web App (production)
    runs-on: ubuntu-latest
    needs: publish
    if: |
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.publish.result == 'success'
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('code/Directory.Packages.props', 'code/**/*.csproj', 'code/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.API_PROJECT_PATH }}

      - name: Install EF Core CLI
        run: |
          dotnet tool install --global dotnet-ef --version 10.*
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Apply EF migrations
        run: dotnet ef database update -s code/FinanceManager.Api/FinanceManager.Api.csproj
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.PROD_CONNECTION_STRING }}

      - name: Download publish artifact
        uses: actions/download-artifact@v8
        with:
          name: finance-manager-api
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy-dev:
    name: Deploy to Azure Web App (develop)
    runs-on: ubuntu-latest
    needs: publish
    if: |
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/develop'
      && needs.publish.result == 'success'
    environment:
      name: development
      url: https://${{ env.AZURE_WEBAPP_NAME_DEV }}.azurewebsites.net
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('code/Directory.Packages.props', 'code/**/*.csproj', 'code/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.API_PROJECT_PATH }}

      - name: Install EF Core CLI
        run: |
          dotnet tool install --global dotnet-ef --version 10.*
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Apply EF migrations
        run: dotnet ef database update -s code/FinanceManager.Api/FinanceManager.Api.csproj
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.DEV_CONNECTION_STRING }}

      - name: Download publish artifact
        uses: actions/download-artifact@v8
        with:
          name: finance-manager-api
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Deploy to Azure Web App (dev)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME_DEV }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_DEV }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
